name: Build Units V2 detail

# Rebuilds dlc/#Global/others/unitsv2_detail.json (the website's Units V2 popup data)
# whenever the GL DB files it reads are pushed, then clears the jsDelivr cache for it.
on:
  push:
    branches: [main]
    paths:
      - 'dlc/#Global/others/unit_master.json'
      - 'dlc/#Global/others/skill_master.json'
      - 'dlc/#Global/others/skill_relation_master.json'
      - 'dlc/#Global/others/unit_fantasy_evo_master.json'
      - 'dlc/#Global/others/unit_limitbreak_master.json'
      - 'tools/build_unitsv2_detail.py'
      - '.github/workflows/build-unitsv2.yml'
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: build-unitsv2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build unitsv2_detail.json
        run: python tools/build_unitsv2_detail.py

      - name: Commit if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "dlc/#Global/others/unitsv2_detail.json"
          if git diff --staged --quiet; then
            echo "No changes in unitsv2_detail.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-build Units V2 detail from GL DB [skip ci]"
            # another workflow (Sheets sync) may have pushed meanwhile
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in "dlc/%23Global/others/unitsv2_detail.json" "dlc/%23Global/others/unit_master.json"; do
            for i in 1 2 3; do
              if curl -fsS "https://purge.jsdelivr.net/gh/tatsutg/GS@main/$f" > /dev/null; then
                echo "Purged $f"; break
              fi
              echo "Purge $f failed (try $i), retrying..."; sleep 5
            done
          done
