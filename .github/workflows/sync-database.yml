name: Sync Database from Google Sheets

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub

concurrency:
  group: sync-database
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch and Generate Static JSON Files
        run: |
          node -e '
          const fs = require("fs");

          async function download(url, filename, retries = 3) {
            const start = Date.now();
            console.log(`\n----------------------------------------`);
            console.log(`[START] Downloading ${filename}...`);

            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                const res = await fetch(url, { redirect: "follow" });

                if (!res.ok) {
                  throw new Error(`HTTP ${res.status} ${res.statusText}`);
                }

                const text = await res.text();
                
                let data;
                try {
                  data = JSON.parse(text);
                } catch (parseErr) {
                  console.error(`\n[RESPONSE ERROR] ${filename} returned non-JSON response:`);
                  console.error(`>>> ${text.slice(0, 200)}...\n`);
                  throw new Error(`Response is HTML/Text instead of JSON. Check Google Apps Script deployment permissions.`);
                }

                if (!Array.isArray(data) && !data.data && !data.items) {
                  throw new Error(`Invalid payload structure for ${filename}`);
                }

                fs.writeFileSync(filename, JSON.stringify(data));
                console.log(`[SUCCESS] Saved ${filename} in ${((Date.now() - start) / 1000).toFixed(2)}s`);
                return true;
              } catch (err) {
                console.warn(`[ATTEMPT ${attempt}/${retries} FAILED] ${filename}: ${err.message}`);
                if (attempt < retries) {
                  await new Promise(r => setTimeout(r, 1500 * attempt));
                }
              }
            }

            console.error(`[SKIP] Could not sync ${filename} after ${retries} attempts.`);
            return false;
          }

          async function main() {
            const startTime = Date.now();
            const tasks = [
              { url: "https://script.google.com/macros/s/AKfycby0fZ7aKD8VWPTr2xgZSiO8_c9Yd3-dC6YWr85m5XtGgycRp-_xSyOOe0YgxZu6pHlQ/exec", name: "units.json" },
              { url: "https://script.google.com/macros/s/AKfycbxzR0SY69T_cnaWLPz249nSlsJnSvpR6UP-VVCfsLE0GGh1RI2b98TqDaJjcV8rKmuy/exec", name: "equips.json" },
              { url: "https://script.google.com/macros/s/AKfycbwA2ZuAAn5lEGdgo5SOlO90cZvD2up6dZ42suTKAejxKSKUbK8lCy4ImBTfphTMavy9RA/exec", name: "quest_stages.json" },
              { url: "https://script.google.com/macros/s/AKfycbzbieBoaG3YJxGfSxwyfzh0SFC_1Wb2NvvdcwEQzGSS9sFNwpBHLA6kR8DaN2ujgwYDbg/exec", name: "crests.json" }
            ];

            let successCount = 0;
            for (const task of tasks) {
              const ok = await download(task.url, task.name);
              if (ok) successCount++;
              await new Promise(r => setTimeout(r, 1200));
            }

            console.log(`\n========================================`);
            console.log(`[SUMMARY] Synced ${successCount}/${tasks.length} datasets in ${((Date.now() - startTime) / 1000).toFixed(2)}s.`);

            if (successCount === 0) {
              console.error("[FATAL] All dataset downloads failed.");
              process.exit(1);
            }
          }

          main().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Commit and Push Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add units.json equips.json quest_stages.json crests.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No database changes detected."
          else
            git commit -m "Auto-sync database from Google Sheets [skip ci]"
            git push
          fi

      - name: Purge jsDelivr CDN Edge Cache
        if: success()
        run: |
          node -e '
          async function purgeCdn() {
            const files = ["units.json", "equips.json", "quest_stages.json", "crests.json"];
            for (const f of files) {
              try {
                const res = await fetch(`https://purge.jsdelivr.net/gh/tatsutg/GS@main/${f}`);
                const json = await res.json();
                console.log(`[CDN PURGED] ${f}:`, json.status || "success");
              } catch (e) {
                console.warn(`[PURGE FAILED] ${f}:`, e.message);
              }
            }
          }
          purgeCdn();
          '
