name: Sync Database from Google Sheets

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub

concurrency:
  group: sync-database
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Generate Static JSON Files
        run: |
          node -e '
          const fs = require("fs");

          async function download(url, filename, retries = 3) {
            const start = Date.now();
            console.log(`[START] Fetching ${filename}...`);

            for (let attempt = 1; attempt <= retries; attempt++) {
              try {
                const res = await fetch(url, {
                  redirect: "follow",
                  headers: {
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                    "Accept": "application/json, text/plain, */*"
                  }
                });

                if (!res.ok) {
                  throw new Error(`HTTP ${res.status} ${res.statusText}`);
                }

                const text = await res.text();
                let data;
                try {
                  data = JSON.parse(text);
                } catch (parseErr) {
                  console.error(`[ERROR] ${filename} returned non-JSON content: ${text.slice(0, 150)}...`);
                  throw new Error(`Invalid JSON response. Please check Google Apps Script deployment/permissions for ${filename}`);
                }

                if (!Array.isArray(data) && !data.data && !data.items) {
                  throw new Error(`Invalid payload structure for ${filename}`);
                }

                fs.writeFileSync(filename, JSON.stringify(data));
                console.log(`[DONE] Saved ${filename} in ${((Date.now() - start) / 1000).toFixed(2)}s`);
                return;
              } catch (err) {
                console.warn(`[RETRY ${attempt}/${retries}] ${filename} failed: ${err.message}`);
                if (attempt === retries) throw err;
                await new Promise(r => setTimeout(r, 2000 * attempt));
              }
            }
          }

          async function main() {
            const startTime = Date.now();
            const tasks = [
              { url: "https://script.google.com/macros/s/AKfycby0fZ7aKD8VWPTr2xgZSiO8_c9Yd3-dC6YWr85m5XtGgycRp-_xSyOOe0YgxZu6pHlQ/exec", name: "units.json" },
              { url: "https://script.google.com/macros/s/AKfycbxzR0SY69T_cnaWLPz249nSlsJnSvpR6UP-VVCfsLE0GGh1RI2b98TqDaJjcV8rKmuy/exec", name: "equips.json" },
              { url: "https://script.google.com/macros/s/AKfycbwA2ZuAAn5lEGdgo5SOlO90cZvD2up6dZ42suTKAejxKSKUbK8lCy4ImBTfphTMavy9RA/exec", name: "quest_stages.json" },
              { url: "https://script.google.com/macros/s/AKfycbxmWnB37-C23jNwzh95IZ2lBPaC2UM6niq7Qr7ILBnsKVp1879VD1ZJbDkSfyIkHmc5Tw/exec", name: "crests.json" }
            ];

            // Sequentially fetch with a 1s delay to respect Google Apps Script rate limits
            for (const task of tasks) {
              await download(task.url, task.name);
              await new Promise(r => setTimeout(r, 1000));
            }

            console.log(`[SUCCESS] All datasets synced in ${((Date.now() - startTime) / 1000).toFixed(2)}s total.`);
          }

          main().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Commit and Push Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add units.json equips.json quest_stages.json crests.json
          if git diff --staged --quiet; then
            echo "No database changes detected."
          else
            git commit -m "Auto-sync database from Google Sheets [skip ci]"
            git push
          fi

      - name: Purge jsDelivr CDN Edge Cache
        if: success()
        run: |
          node -e '
          async function purgeCdn() {
            const files = ["units.json", "equips.json", "quest_stages.json", "crests.json"];
            await Promise.all(files.map(f => fetch(`https://purge.jsdelivr.net/gh/tatsutg/GS@main/${f}`).catch(() => {})));
            console.log("jsDelivr CDN cache purge requested successfully.");
          }
          purgeCdn();
          '
