name: Build Summons detail

# Rebuilds dlc/Global/_DATABASE/others/summons_detail.json (the website's Summon tab data)
# whenever the GL DB files it reads are pushed, then clears the jsDelivr cache for it.
on:
  push:
    branches: [main]
    paths:
      - 'dlc/Global/_DATABASE/**/gacha_master.json'
      - 'dlc/Global/_DATABASE/**/gacha_step_up_master.json'
      - 'dlc/Global/_DATABASE/**/unit_master.json'
      - 'dlc/Global/_DATABASE/**/item_master.json'
      - 'dlc/Global/summon/banner/**'
      - 'dlc/unit/thumbnail/**'
      - 'dlc/Global/_DATABASE/others/summons_detail.json'
      - 'tools/build_summons_detail.py'
      - '.github/workflows/build-summons.yml'
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: build-summons
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build summons_detail.json
        run: python tools/build_summons_detail.py

      - name: Commit if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "dlc/Global/_DATABASE/others/summons_detail.json"
          if git diff --staged --quiet; then
            echo "No changes in summons_detail.json."
          else
            git commit -m "Auto-build Summons detail from GL DB [skip ci]"
            # another workflow (Sheets sync / Units V2 / Equips V2) may have pushed meanwhile
            git pull --rebase origin main
            git push
          fi

      # Always purge: the built file may also arrive in your own push (then "No changes" above),
      # and jsDelivr would keep serving the old copy for up to 12 hours.
      - name: Purge jsDelivr cache
        run: |
          f="dlc/Global/_DATABASE/others/summons_detail.json"
          for i in 1 2 3; do
            if curl -fsS "https://purge.jsdelivr.net/gh/tatsutg/GS@main/$f" > /dev/null; then
              echo "Purged $f"; break
            fi
            echo "Purge $f failed (try $i), retrying..."; sleep 5
          done
