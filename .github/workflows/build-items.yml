name: Build Items detail

# Rebuilds dlc/Global/_DATABASE/others/items_detail.json (the website's Items tab data)
# whenever the GL DB files it reads are pushed, then clears the jsDelivr cache for it.
on:
  push:
    branches: [main]
    paths:
      - 'dlc/Global/_DATABASE/**/material_master.json'
      - 'dlc/Global/_DATABASE/**/ci_generic_material_master.json'
      - 'dlc/Global/_DATABASE/**/ci_unique_material_master.json'
      - 'dlc/Global/_DATABASE/**/event_item_master.json'
      - 'dlc/Global/_DATABASE/**/food_master.json'
      - 'dlc/Global/_DATABASE/**/cooking_recipe_master.json'
      - 'dlc/Global/_DATABASE/**/rune_master.json'
      - 'dlc/Global/_DATABASE/**/rune_type_master.json'
      - 'dlc/Global/_DATABASE/**/raid_ticket_master.json'
      - 'dlc/Global/_DATABASE/**/quest_master.json'
      - 'dlc/Global/_DATABASE/**/event_shop_master.json'
      - 'dlc/Global/_DATABASE/**/orb_shop_master.json'
      - 'dlc/Global/_DATABASE/**/item_evolution_master.json'
      - 'dlc/Global/_DATABASE/**/item_recipe_master.json'
      - 'dlc/Global/_DATABASE/**/unit_evolution_master.json'
      - 'dlc/Global/_DATABASE/**/unit_fantasy_evo_master.json'
      - 'dlc/Global/_DATABASE/others/items_detail.json'
      - 'tools/build_items_detail.py'
      - '.github/workflows/build-items.yml'
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: build-items
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build items_detail.json
        run: python tools/build_items_detail.py

      - name: Commit if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "dlc/Global/_DATABASE/others/items_detail.json"
          if git diff --staged --quiet; then
            echo "No changes in items_detail.json."
          else
            git commit -m "Auto-build Items detail from GL DB [skip ci]"
            # another workflow (Sheets sync / Units V2 / Equips V2) may have pushed meanwhile
            git pull --rebase origin main
            git push
          fi

      # Always purge: the built file may also arrive in your own push (then "No changes" above),
      # and jsDelivr would keep serving the old copy for up to 12 hours.
      - name: Purge jsDelivr cache
        run: |
          f="dlc/Global/_DATABASE/others/items_detail.json"
          for i in 1 2 3; do
            if curl -fsS "https://purge.jsdelivr.net/gh/tatsutg/GS@main/$f" > /dev/null; then
              echo "Purged $f"; break
            fi
            echo "Purge $f failed (try $i), retrying..."; sleep 5
          done
